services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ahtara
      POSTGRES_USER: ahtara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ahtara}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahtara"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
volumes:
  pgdata:
