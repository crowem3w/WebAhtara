[project]
name = "ahtara-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1,<5.3",
    "fastapi>=0.115",
    "pydantic[email]>=2.7",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "whitenoise>=6.7",
]

# Tells Vercel where the FastAPI instance named `app` lives.
[tool.vercel]
entrypoint = "api.main:app"

# Collects the Django admin's CSS/JS into staticfiles/ so WhiteNoise can serve it.
[tool.vercel.scripts]
build = "python manage.py collectstatic --noinput"
